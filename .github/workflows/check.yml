name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check generated HCL adapter
        shell: pwsh
        run: |
          go install github.com/hashicorp/packer-plugin-sdk/cmd/packer-sdc@v0.6.13
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:GOFILE = 'config.go'
          $env:GOPACKAGE = 'provisioner'
          Push-Location provisioner
          packer-sdc mapstructure-to-hcl2 -type Config
          Pop-Location
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- provisioner/config.hcl2spec.go
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Format
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = @(gofmt -l $files)
          if ($unformatted.Count) { throw ($unformatted -join "`n") }
      - run: go vet ./...
      - name: Static analysis and vulnerability scan
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: local
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: go run ./cmd/doccheck main.go provisioner internal guest cmd test
      - name: Report schema
        shell: pwsh
        run: |
          if (-not (Get-Content docs/sample-report.json -Raw | Test-Json -SchemaFile docs/report.schema.json)) { throw 'Sample report does not match schema' }
      - run: go test ./...
      - name: Build and validate plugin
        shell: pwsh
        run: |
          go build -ldflags '-X main.versionPrerelease=' -o bin/packer-plugin-windows-checkup${{ runner.os == 'Windows' && '.exe' || '' }} .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./bin/packer-plugin-windows-checkup${{ runner.os == 'Windows' && '.exe' || '' }} describe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
      - name: Validate SDK configuration
        shell: pwsh
        env:
          PKR_VAR_winrm_host: 192.0.2.1
          PKR_VAR_winrm_username: fixture
          PKR_VAR_winrm_password: fixture
        run: |
          packer plugins install --path bin/packer-plugin-windows-checkup${{ runner.os == 'Windows' && '.exe' || '' }} github.com/larskroghdk/windows-checkup
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          packer validate examples/local
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: PowerShell readers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck
          ./scripts/check-powershell.ps1
          Import-Module Pester -RequiredVersion 5.6.1
          ./scripts/test-powershell.ps1
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - shell: bash
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /tmp/checkup-$os-$arch .
            done
          done

  snapshot:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Determine Packer plugin API version
        run: |
          go build -o "$RUNNER_TEMP/packer-plugin-windows-checkup" .
          API_VERSION=$("$RUNNER_TEMP/packer-plugin-windows-checkup" describe | jq -er '.api_version | select(type == "string" and length > 0)')
          echo "API_VERSION=$API_VERSION" >> "$GITHUB_ENV"
      - name: Build unsigned snapshots
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --snapshot --skip=publish,sign --clean
      - name: Archive snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-snapshots
          path: dist/
          if-no-files-found: error
